<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Guide - Madara Uchiha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="menu">
      <a href="index.html" class="logo"><img src="imagens/leque-uchiha.svg" alt="Brasão Uchiha"> Style Guide</a>
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </nav>
  </header>

  <main>
    <section class="secao">
      <h2>Cores</h2>
      <div class="cores">
        <div><div class="cor" style="background-color: #0d0b0e;"></div><p>Preto #0d0b0e</p></div>
        <div><div class="cor" style="background-color: #1c171f;"></div><p>Cinza #1c171f</p></div>
        <div><div class="cor" style="background-color: #c3121c;"></div><p>Vermelho #c3121c</p></div>
        <div><div class="cor" style="background-color: #9b86d6;"></div><p>Roxo #9b86d6</p></div>
        <div><div class="cor" style="background-color: #e9e2d4;"></div><p>Claro #e9e2d4</p></div>
      </div>
    </section>

    <section class="secao escura">
      <h2>Fontes</h2>
      <div class="cards">
        <div class="card">
          <h1>Cinzel</h1>
          <p>Usada nos títulos</p>
        </div>
        <div class="card">
          <p style="font-size: 32px;">Poppins</p>
          <p>Usada nos textos</p>
        </div>
      </div>
    </section>

    <section class="secao">
      <h2>Componentes</h2>
      <div class="cards">
        <a href="#" class="botao">Botão <i class="fa-solid fa-arrow-right"></i></a>
        <div class="card">
          <img src="imagens/sharingan.svg" alt="Sharingan">
          <h3>Card</h3>
          <p>Borda roxa que fica vermelha no hover.</p>
        </div>
      </div>
    </section>

    <section class="secao escura">
      <h2>Ícones</h2>
      <div class="cards vermelho" style="font-size: 32px;">
        <i class="fa-solid fa-fire"></i>
        <i class="fa-solid fa-eye"></i>
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-mask"></i>
        <i class="fa-solid fa-skull"></i>
      </div>
    </section>
  </main>

  <footer>
    <p>Checkpoint 3 - Madara Uchiha</p>
    <a href="index.html"><i class="fa-solid fa-house"></i> Início</a>
  </footer>

</body>
</html>
