<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Lua com o Rinne Sharingan do Tsukuyomi Infinito</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".72" stop-color="#c3121c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c3121c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset=".75" stop-color="#b3101a"/>
      <stop offset="1" stop-color="#5c060b"/>
    </radialGradient>
    <g id="tm"><circle cx="0" cy="0" r="9" fill="#0d0b0e"/><path d="M-9 0 Q -10 16 8 18 Q -2 10 0 0 Z" fill="#0d0b0e"/></g>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="150" fill="url(#moon)"/>
  <g fill="none" stroke="#0d0b0e" stroke-width="4" stroke-opacity=".85">
    <circle cx="200" cy="200" r="118"/>
    <circle cx="200" cy="200" r="86"/>
    <circle cx="200" cy="200" r="54"/>
    <circle cx="200" cy="200" r="24"/>
  </g>
  <g transform="translate(200 200)">
    <use href="#tm" transform="rotate(0) translate(0 -86)"/>
    <use href="#tm" transform="rotate(120) translate(0 -86)"/>
    <use href="#tm" transform="rotate(240) translate(0 -86)"/>
    <use href="#tm" transform="rotate(60) translate(0 -54)"/>
    <use href="#tm" transform="rotate(180) translate(0 -54)"/>
    <use href="#tm" transform="rotate(300) translate(0 -54)"/>
    <use href="#tm" transform="rotate(30) translate(0 -118)"/>
    <use href="#tm" transform="rotate(150) translate(0 -118)"/>
    <use href="#tm" transform="rotate(270) translate(0 -118)"/>
  </g>
  <circle cx="200" cy="200" r="10" fill="#0d0b0e"/>
</svg>
